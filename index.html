<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#10100f" />
    <meta
      name="description"
      content="对照日本《DO IT!》展览影像重建的十组动作跟练。"
    />
    <script>
      if (location.protocol === "https:") {
        const a = document.createElement("script");
        a.defer = true;
        a.src = "https://cloud.umami.is/script.js";
        a.dataset.websiteId = "e01c9f78-4607-4e60-b01c-77c8190b12b4";
        document.head.append(a);
      }
    </script>
    <title>DO IT! · 动词放映室</title>
    <link rel="stylesheet" href="projection/stage.css" />
    <script defer src="projection/score.js"></script>
    <script defer src="projection/language.js"></script>
    <script defer src="projection/guide.js"></script>
    <script defer src="projection/objects.js"></script>
    <script defer src="projection/audio.js"></script>
    <script defer src="projection/local.js"></script>
    <script defer src="projection/player.js"></script>
  </head>
  <body>
    <div id="app">
      <header>
        <div class="brand"><b>DO IT!</b><span>动词放映室</span></div>
        <div class="headerTools">
          <div class="languages" aria-label="Language">
            <button id="zh" lang="zh-CN">中文</button
            ><button id="en" lang="en">English</button>
          </div>
          <button id="about" class="link">作品与对照</button>
        </div>
      </header>
      <main>
        <section id="theater" aria-label="跟练投影">
          <button id="surface" aria-label="暂停" hidden></button
          ><canvas id="art" aria-label="白线动作示范与实景投影"></canvas>
          <div id="footage" hidden>
            <video id="film" playsinline preload="metadata"></video>
          </div>
          <div id="filmCue" hidden></div>
          <div id="result" hidden>
            <strong id="resultText"></strong><button id="replay"></button>
          </div>
          <div id="curtain">
            <div class="pitch">
              <div lang="ja">デザインあ展 neo</div>
              <h1>DO IT!</h1>
              <p>点画面暂停</p>
            </div>
            <button id="start" disabled>
              开始 <span aria-hidden="true">▶</span>
            </button>
          </div>
        </section>
        <div class="readout">
          <strong id="current">全场跟练</strong
          ><span id="counter">0:00 / 3:30</span>
        </div>
        <label class="seek"
          ><span class="sr">播放进度</span
          ><input id="seek" type="range" min="0" max="210" step=".05" value="0"
        /></label>
        <nav aria-label="播放控制">
          <button id="transport" aria-label="播放">▶ <span>播放</span></button>
          <button id="chapters">动作目录</button>
          <button id="loop" aria-pressed="false">单段循环</button>
          <label class="rate"
            ><span class="sr">播放速度</span
            ><select id="rate" aria-label="播放速度">
              <option value=".75">0.75×</option>
              <option value="1" selected>1×</option>
              <option value="1.25">1.25×</option>
              <option value="1.5">1.5×</option>
            </select></label
          >
          <button id="variant" hidden>正面投影 ⇄</button>
          <div class="spacer"></div>
          <button id="mute" aria-pressed="false">声音开</button
          ><button id="expand">全屏 ⛶</button>
        </nav>
        <div id="notice" role="status"></div>
      </main>
      <footer>
        <span
          >デザインあ展 neo ／ DO IT!　<span class="dim"
            >网页研究版 · v2.3.0</span
          ></span
        ><a href="https://github.com/holynova/verb-theater">GitHub ↗</a>
      </footer>
    </div>
    <dialog id="list">
      <div class="dlgHead">
        <h2>动作目录</h2>
        <button data-close aria-label="关闭动作目录">×</button>
      </div>
      <div id="moves"></div>
    </dialog>
    <dialog id="info">
      <div class="dlgHead">
        <h2>作品与对照</h2>
        <button data-close aria-label="关闭作品信息">×</button>
      </div>
      <p>
        《DO IT!》是日本「デザインあ展
        neo」的影像装置。导演中村勇吾，音乐蓮沼執太，声音 DJ KOO。
      </p>
      <p>
        网页按制作方公开影片的时间编排十组动作，独立绘制手势、制作实景动画和节拍。载入对应的
        3 分 30 秒影片后，可随时切换网页重建、正面投影和原镜头。
      </p>
      <p>
        <a href="https://tha.jp/10179" target="_blank" rel="noopener"
          >THA 作品与影片 ↗</a
        >　<a
          href="https://www.youtube.com/watch?v=TP6L3JbJLZQ"
          target="_blank"
          rel="noopener"
          >展厅全程记录 ↗</a
        >
      </p>
      <label for="file" class="file">载入本地对照片</label
      ><input id="file" type="file" accept="video/*" />
      <p id="localStatus">文件在本机读取。</p>
      <div id="views" hidden></div>
    </dialog>
  </body>
</html>
